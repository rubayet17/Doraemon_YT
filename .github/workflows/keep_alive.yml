name: Keep Streamlit Alive

on:
  schedule:
    # Prot 10 minute por por ping korbe
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Request to Streamlit App
        run: |
          curl -I https://doraemon-yt-control.streamlit.app/
